<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衛道考古題申請查詢</title>
<style>
  :root { --main:#1f4e8c; --ok:#1e7d4f; --warn:#b26a00; --bad:#b3261e; --bg:#f5f7fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:#222; line-height:1.6; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.35rem; color:var(--main); margin:8px 0 4px; }
  .sub { color:#666; font-size:.9rem; margin:0 0 18px; }
  .card { background:#fff; border-radius:14px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
  label { font-weight:600; display:block; margin-bottom:8px; }
  .row { display:flex; gap:8px; }
  input { flex:1; font-size:1.15rem; padding:12px; border:1.5px solid #ccd; border-radius:10px; letter-spacing:1px; min-width:0; }
  input:focus { outline:none; border-color:var(--main); }
  button { font-size:1rem; padding:0 18px; border:none; border-radius:10px; background:var(--main); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; }
  #result { display:none; }
  .badge { display:inline-block; font-weight:700; font-size:1.1rem; padding:4px 12px; border-radius:999px; color:#fff; margin-bottom:10px; }
  .ok { background:var(--ok); } .warn { background:var(--warn); } .bad { background:var(--bad); } .gray { background:#777; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  td { padding:6px 4px; border-top:1px solid #eee; }
  td:first-child { color:#666; width:42%; }
  h2 { font-size:1.05rem; margin:0 0 8px; color:var(--main); }
  ol { padding-left:1.3em; margin:0; }
  li { margin-bottom:6px; }
  code { background:#eef2f8; padding:1px 6px; border-radius:6px; font-size:.95em; }
  .note { font-size:.88rem; color:#666; }
  .alert { background:#fff4e5; border-left:4px solid var(--warn); padding:10px 12px; border-radius:8px; font-size:.92rem; }
</style>
</head>
<body>
<main>
  <h1>衛道考古題申請查詢</h1>
  <p class="sub">輸入學號，查看考古題資料夾是否已開通</p>

  <div class="card">
    <label for="sid">學號</label>
    <div class="row">
      <input id="sid" inputmode="numeric" pattern="[0-9]*" maxlength="20" placeholder="例如 1150123" autocomplete="off">
      <button id="go">查詢</button>
    </div>
    <p class="note">資料每 10 分鐘更新一次；剛寄出申請的話，請稍後再查。</p>
  </div>

  <div class="card" id="result"></div>

  <div class="card">
    <h2>怎麼申請</h2>
    <ol>
      <li>用<strong>學校信箱</strong>（<code>學號@vtsh.tc.edu.tw</code>）寄信</li>
      <li>主旨寫：<code>考古題申請</code></li>
      <li>內文<strong>只寫一個</strong>要開通的 Google 帳號（Gmail）</li>
      <li>寄出後回到這個頁面，用學號查詢結果</li>
    </ol>
    <p class="note">權限到畢業當年 6/30 為止。國三生會一併開通高中部資料夾。</p>
    <div class="alert">本系統<strong>不會回信</strong>，請自行回來查詢。用個人信箱寄信的申請不會被處理。</div>
  </div>
</main>

<script>
// ===== 設定區 =====
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxZueZVmEGq0xyHo7b5VkCMsSugqKz8jv1Utv3uAYyoR_d5yOF-SRrPxEyTIMJa0Mziag/exec'; // Apps Script 網頁應用程式網址（結尾 /exec）
// ==================

const $ = id => document.getElementById(id);
const box = $('result');

function show(html) { box.innerHTML = html; box.style.display = 'block'; }

function render(d) {
  switch (d.status) {
    case 'approved': {
      const rows = (d.grants || []).map(g =>
        `<tr><td>開通帳號</td><td>${g.account}</td></tr><tr><td>有效期限</td><td>${g.expire}</td></tr>`).join('');
      return show(`<span class="badge ok">✓ 已開通</span>
        <table><tr><td>開通日期</td><td>${d.approvedDate || ''}</td></tr>${rows}</table>
        <p class="note">請用上面的帳號登入 Google 雲端硬碟，在「與我共用」中找到資料夾。</p>`);
    }
    case 'pending':
      return show(`<span class="badge warn">處理中</span><p>${d.hint || '管理員確認中，請過幾天再查詢'}</p>`);
    case 'revoked':
      return show(`<span class="badge bad">已收回</span><p>此申請的權限已收回。如有疑問，請依申請方式重新寄信。</p>`);
    case 'notfound':
      return show(`<span class="badge gray">查無申請</span><p>沒有找到這個學號的申請紀錄。請確認是用<strong>學校信箱</strong>寄出、主旨為「考古題申請」。</p>`);
    case 'invalid':
      return show(`<span class="badge bad">學號格式錯誤</span><p>請輸入 6～7 位數字的學號。</p>`);
    default:
      return show(`<span class="badge bad">查詢失敗</span><p>請稍後再試。</p>`);
  }
}

// 學號整理：全形數字 ０-９ 轉半形、去掉所有空白（含全形空白）
function normalizeSid(raw) {
  return String(raw || '')
    .replace(/[\uFF10-\uFF19]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[\s\u3000]+/g, '');
}

async function query() {
  const sid = normalizeSid($('sid').value);
  $('sid').value = sid; // 回填整理後的學號
  if (!/^\d{6,7}$/.test(sid)) return render({ status: 'invalid' });
  if (ENDPOINT.startsWith('PASTE')) return show('<span class="badge gray">尚未啟用</span><p>查詢功能即將開放。</p>');
  $('go').disabled = true;
  show('<p>查詢中…</p>');
  try {
    const r = await fetch(ENDPOINT + '?sid=' + encodeURIComponent(sid));
    render(await r.json());
  } catch (e) {
    render({ status: 'error' });
  } finally {
    $('go').disabled = false;
  }
}

$('go').addEventListener('click', query);
$('sid').addEventListener('keydown', e => { if (e.key === 'Enter') query(); });
</script>
</body>
</html>
